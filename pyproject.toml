[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apitoken"
version = "0.1.0"
description = "Консольная утилита для работы с API по токену"
requires-python = ">=3.8"

[project.scripts]
apitoken = "apitoken.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
